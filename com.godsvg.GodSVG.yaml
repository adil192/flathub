app-id: com.godsvg.GodSVG
runtime: org.freedesktop.Platform
runtime-version: 25.08
sdk: org.freedesktop.Sdk
command: GodSVG
finish-args:
  - --device=dri
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
build-options:
  env:
    BUILD_TEMPLATE_OPTIONS: target=template_release lto=full production=yes deprecated=no minizip=no d3d12=no vulkan=no use_volk=no disable_3d=yes disable_physics_2d=yes disable_navigation_2d=yes modules_enabled_by_default=no module_freetype_enabled=yes module_gdscript_enabled=yes module_svg_enabled=yes module_jpg_enabled=yes module_text_server_adv_enabled=yes graphite=no module_webp_enabled=yes module_mbedtls_enabled=yes build_profile=./disabled_classes.gdbuild
modules:
  - name: scons
    buildsystem: simple
    cleanup: ['*']
    build-commands:
      - pip3 install --no-index --no-build-isolation --prefix=/app .
    sources:
      - type: archive
        sha256: 99c0e94a42a2c1182fa6859b0be697953db07ba936ecc9817ae0d218ced20b15
        url: https://downloads.sourceforge.net/project/scons/scons/4.10.1/SCons-4.10.1.tar.gz
        x-checker-data:
          type: anitya
          project-id: 4770
          url-template: https://downloads.sourceforge.net/project/scons/scons/$version/SCons-$version.tar.gz
  - name: Godot
    buildsystem: simple
    cleanup: ['*']
    build-commands:
      - python3 /app/bin/scons p=linuxbsd -j "$FLATPAK_BUILDER_N_JOBS"
      - install -Dm755 bin/godot.linuxbsd.editor.* /app/godot/godot
      - touch /app/godot/._sc_ # godot self-contained mode
      - python3 /app/bin/scons p=linuxbsd -j "$FLATPAK_BUILDER_N_JOBS" ${BUILD_TEMPLATE_OPTIONS}
      - install -Dm755 bin/godot.linuxbsd.template_release.* /app/godot/editor_data/export_templates/$(python3 -c 'import version; print(f"{version.major}.{version.minor}.{version.status}")')/linux_release.${FLATPAK_ARCH}
    sources:
      - type: archive
        sha256: 2cdb383d68bfe646c832064b9063310745e8db03a2e4b59f5946ee934b95c67d
        url: https://github.com/godotengine/godot/releases/download/4.5-stable/godot-4.5-stable.tar.xz
      - type: file
        path: assets/disabled_classes.gdbuild
  - name: AccessKit
    buildsystem: simple
    build-commands:
      - cmake -S accesskit-c -B build -DCMAKE_BUILD_TYPE=Release
      - cmake --build build
      - cmake --install build
      - install -Dm755 build/libaccesskit.so /app/bin/libaccesskit.so
    sources:
      - type: git
        url: https://github.com/godotengine/godot-accesskit-c-static/
        tag: 0.18.0
        commit: 38e2c8de8b6f3b0dd5996c37e73174d6fb733b78
        x-checker-data:
          type: git
          tag-pattern: ^(\d+\.\d+\.\d+)$
  - name: GodSVG
    buildsystem: simple
    cleanup:
      - /app/godot/editor_data
    build-commands:
      - /app/godot/godot --headless --export-release Linux /app/bin/GodSVG
      - install -Dm644 com.godsvg.GodSVG.desktop /app/share/applications/com.godsvg.GodSVG.desktop
      - install -Dm644 com.godsvg.GodSVG.metainfo.xml /app/share/metainfo/com.godsvg.GodSVG.metainfo.xml
      - install -Dm644 assets/logos/icon.svg /app/share/icons/hicolor/scalable/apps/com.godsvg.GodSVG.svg
    sources:
      - type: git
        url: https://github.com/MewPurPur/GodSVG.git
        tag: v1.0-alpha13
        commit: b9ad9f5b1ec5590b9e215ca6516199d26dced2eb
        x-checker-data:
          type: git
          tag-pattern: ^v(\d.+)$
          is-main-source: true
      - type: file
        path: assets/com.godsvg.GodSVG.desktop
      - type: file
        path: assets/com.godsvg.GodSVG.metainfo.xml
